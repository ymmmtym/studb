version: '3'
services:
    studb:
        build: .
        image: yumemo/studb
        container_name: studb
        hostname: studb
        tty: true
        volumes:
          - .:/app/studb
          - /app/studb/.venv
          - type: bind
            source: ./db.sqlite3
            target: /app/studb/db.sqlite3
            bind:
              create_host_path: false
        ports:
          - "8000:8000"
